name: Centore Bridge private-source CI

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Private Centore-Bridge branch/tag/SHA to verify"
        required: true
        default: "maintenance/v2.5-smallbrain-foundation"
        type: string
      suite:
        description: "Verification scope"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - foundation

permissions:
  contents: read

concurrency:
  group: centore-bridge-\${{ inputs.source_ref }}-\${{ inputs.suite }}
  cancel-in-progress: false

jobs:
  verify:
    name: Centore Bridge (\${{ inputs.suite }})
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      PYTHONPATH: \${{ github.workspace }}\source;\${{ github.workspace }}\source\tests

    steps:
      - name: Check out public build farm
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out private Centore-Bridge source
        uses: actions/checkout@v4
        with:
          repository: Sharkecho/Centore-Bridge
          ref: \${{ inputs.source_ref }}
          token: \${{ secrets.CENTORE_BRIDGE_READ_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        working-directory: source
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check jsonschema
          python -m pip install --disable-pip-version-check -r requirements-smallbrain.txt
          python -m pip install --disable-pip-version-check -r requirements-v2-ci.txt

      - name: Secret scan (sanitized public output)
        working-directory: source
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "centore-secret-scan.log"
          & python scripts/secret_scan.py *> $log
          $rc = $LASTEXITCODE
          if ($rc -ne 0) {
            Write-Host "::error::Secret scan failed. Details are intentionally withheld from this public workflow log."
            exit $rc
          }
          Write-Host "CENTORE_SECRET_SCAN=PASS"

      - name: Run private-source verification (sanitized public output)
        working-directory: source
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "centore-tests.log"
          if ("\${{ inputs.suite }}" -eq "foundation") {
            & python -m unittest -v               tests.test_68_memory_migration               tests.test_69_memory_backup_restore               tests.test_70_experience_migration               tests.test_71_experience_backup_restore               tests.test_72_evidence_manifest               tests.test_73_project_memory_context               tests.test_74_experience_context               tests.test_75_memory_recorder               tests.test_76_workflow_state_compat               tests.test_77_checkpoint_metadata               tests.test_78_control_data_foundation               tests.test_79_baseline_docs *> $log
          } else {
            & python scripts/run_tests.py *> $log
          }
          $rc = $LASTEXITCODE
          if ($rc -ne 0) {
            Write-Host "::error::Centore-Bridge verification failed. Private test output is not published; reproduce in the private repository."
            exit $rc
          }
          Write-Host "CENTORE_PRIVATE_SOURCE_TESTS=PASS"
          "### Centore-Bridge public build farm" >> $env:GITHUB_STEP_SUMMARY
          "- Source ref: `${{ inputs.source_ref }}`" >> $env:GITHUB_STEP_SUMMARY
          "- Suite: `${{ inputs.suite }}`" >> $env:GITHUB_STEP_SUMMARY
          "- Result: **PASS**" >> $env:GITHUB_STEP_SUMMARY

      - name: Remove private checkout
        if: always()
        shell: pwsh
        run: |
          if (Test-Path source) {
            Remove-Item -LiteralPath source -Recurse -Force -ErrorAction SilentlyContinue
          }
          Write-Host "private checkout cleanup: DONE"
