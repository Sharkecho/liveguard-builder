name: Build R5S baseline

on:
  workflow_dispatch:
  push:
    paths:
      - config/**
      - package/**
      - .github/workflows/**

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses5-dev libssl-dev rsync unzip zlib1g-dev file wget
      - name: Checkout OpenWrt
        run: git clone --depth 1 https://github.com/openwrt/openwrt.git openwrt
      - name: Configure and build R5S
        working-directory: openwrt
        run: |
          cp ../config/r5s-baseline.config .config
          mkdir -p package/liveguard-skeleton
          cp -R ../package/liveguard-skeleton/* package/liveguard-skeleton/
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          make download -j2
          make -j2
      - name: Generate manifest and SHA256
        working-directory: openwrt
        run: |
          find bin -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          find bin -type f -printf "%P\n" | sort > MANIFEST.txt
      - uses: actions/upload-artifact@v4
        with:
          name: liveguard-r5s-build
          path: |
            openwrt/bin/**
            openwrt/MANIFEST.txt
            openwrt/SHA256SUMS
