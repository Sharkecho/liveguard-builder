name: Build R5S baseline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r5s-baseline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3-pyelftools rsync unzip zlib1g-dev file wget zstd

      - name: Show runner disk space
        run: df -h

      - name: Checkout pinned OpenWrt release
        run: git clone --branch v24.10.8 --depth 1 https://github.com/openwrt/openwrt.git openwrt

      - name: Configure and build R5S
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail
          cp ../r5s-baseline.config .config
          mkdir -p package/liveguard-skeleton
          cp ../Makefile package/liveguard-skeleton/Makefile
          cp ../README.public package/liveguard-skeleton/README.public
          # The baseline uses only packages in the pinned OpenWrt tree.
          # Installing every external feed can introduce unrelated Kconfig cycles.
          make defconfig
          make download -j2
          make -j2 V=s
          df -h

      - name: Generate manifest and SHA256
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail
          find bin -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          find bin -type f -printf "%P\n" | sort > MANIFEST.txt

      - uses: actions/upload-artifact@v4
        with:
          name: liveguard-r5s-build
          path: |
            openwrt/bin/**
            openwrt/MANIFEST.txt
            openwrt/SHA256SUMS
